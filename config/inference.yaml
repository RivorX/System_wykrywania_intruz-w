# === MODEL ===
# ------------------------------------------------------------
model:
  name: yolo26s.pt
  local_weights_dir: models/base
  auto_download: true
  trained_weights:
    enabled: true
    dir: models/weights/latest
    preferred: best
    prefer_canonical: true
    fallback_to_base: true
  download_url: null
  fallback_name: null
  use_fallback: false
  force_redownload: false
  selected_model_path: models\base\yolo26s.pt
  day_segmentation:
    enabled: true
    name: yolo26s-seg.pt
    local_weights_dir: models/base
    auto_download: true
    download_url: null
    fallback_name: null
    use_fallback: false
    force_redownload: false
    selected_model_path: models\base\yolo26s-seg.pt

# === INFERENCE ===
# ------------------------------------------------------------
inference:
  conf: 0.27
  iou: 0.42
  imgsz: 960
  max_det: 100
  classes:
  - 0
  device: '0'
  half: true
  compile: false
  fix_unicode_cache_paths: true
  cache_root_dir: C:/torch_cache

# === TRACKER ===
# ------------------------------------------------------------
tracker:
  enabled: true
  backend: botsort
  frame_rate: 30
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer: 45
  match_thresh: 0.8
  fuse_score: false
  proximity_thresh: 0.5
  appearance_thresh: 0.25
  with_reid: false
  gmc_method: none

# === SECURITY ===
# ------------------------------------------------------------
security:
  mode: auto
  night_start_hour: 22
  night_end_hour: 6
  day_person_threshold: 1
  night_person_threshold: 1

# === UNIFORM ===
# ------------------------------------------------------------
uniform:
  enabled: true
  top_color: "#2F5FA8"
  bottom_color: "#1F2430"
  color_tolerance: 55.0
  min_mask_pixels: 50

# === EVENTS ===
# ------------------------------------------------------------
events:
  enabled: true
  min_visible_seconds: 4.0
  cooldown_seconds: 11.0
  linger_seconds: 5.0
  min_person_count: 1
  max_saved_events: 302
  save_annotated_frame: true
  once_per_streak: true
  output_dir: logs/app/events

# === RUNTIME ===
# ------------------------------------------------------------
runtime:
  scan_max_index: 8
  auto_start_live: true
  auto_scan_cameras_on_startup: false
  suppress_opencv_warnings: true
  console_logs: false
  loop_videos: true
  window_title: Intrusion Detection - Multi Source
  start_fullscreen: true
  start_maximized: true
  grid_columns: auto
  last_recording_path: data\videos\demo.mp4
  frame_interval_ms: 16
  view_target_fps: 60.0
  view_fps_smoothing: 0.2
  view_cap_to_source_fps: true
  video_fps_fallback: 25.0
  model_target_fps: 24.0
  max_infer_per_tick: 6
  infer_batch_coalesce_ms: 5.0
  uniform_recheck_interval_sec: 5.0
  uniform_recheck_iou: 0.80
  uniform_max_fresh_per_cycle: 1
  uniform_worker_hold_sec: 5.0
  uniform_memory_ttl_sec: 8.0
  capture_buffer_size: 1
  camera_backend: msmf
  camera_width: 0
  camera_height: 0
  camera_fps: 0
  detection_box_hold_sec: 0.5
  live_tile_spacing: 3
  annotation_reference_height: 720
  annotation_label_font_scale: 0.48
  annotation_status_font_scale: 0.46
  annotation_min_resolution_scale: 0.45
  annotation_max_resolution_scale: 4.0

# === DEBUG ===
# ------------------------------------------------------------
debug:
  enabled: false
  console: true
  profiling: true
  profile_interval_sec: 5.0
